# yaml-language-server: $schema=https://deltares.github.io/veriflow/v0/config.schema.json
version: v0
general:
  verification_period:
    dimension: forecast_reference_time
    start: "2025-05-15T00:00:00Z"
    end: "2026-06-01T00:00:00Z"
  verification_pairs:
    - id: PC_GEPS
      obs: observed
      sim: simulated_GEPS
      variable: PC
    - id: PC_GEFS
      obs: observed
      sim: simulated_GEFS
      variable: PC
    - id: PC_IFS
      obs: observed
      sim: simulated_IFS
      variable: PC
  lead_times:
    unit: D
    values: [1, 2, 3, 4, 5, 6]
datasources:
  - import_adapter: fewswebservice
    source: observed
    data_type: observed_historical
    location_ids:
      - "3031092"
    parameter_ids:
      - PC.obs
    module_instance_id: ImportMeteoStations
    webservice_version: "2025.02"

  - import_adapter: fewswebservice
    source: simulated_GEPS
    data_type: simulated_forecast_ensemble
    location_ids:
      - "3031092"
    parameter_ids:
      - PC.nwp
    module_instance_id: PreprocessGEPS
    ensemble_id: GEPS
    webservice_version: "2025.02"

  - import_adapter: fewswebservice
    source: simulated_GEFS
    data_type: simulated_forecast_ensemble
    location_ids:
      - "3031092"
    parameter_ids:
      - PC.nwp
    module_instance_id: PreprocessGEFS
    ensemble_id: GEFS
    webservice_version: "2025.02"

  - import_adapter: fewswebservice
    source: simulated_IFS
    data_type: simulated_forecast_ensemble
    location_ids:
      - "3031092"
    parameter_ids:
      - PC.nwp
    module_instance_id: PreprocessIFS
    ensemble_id: IFS
    webservice_version: "2025.02"

scores:
  - score_adapter: crps_for_ensemble
  - score_adapter: rank_histogram
    reduce_dims:
      - forecast_reference_time
      
id_mapping: 
  variable:
    PC:
      observed: PC_obs
      simulated_GEFS: PC_nwp
      simulated_GEPS: PC_nwp
      simulated_IFS: PC_nwp
