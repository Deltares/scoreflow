name: Publish Python distribution to PyPI 🐍

on:
  release:
    types: [published] # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#release

# Never cancel an in-progress release, but avoid overlapping publishes for the same ref.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    name: Build docs (gate)
    uses: ./.github/workflows/docs-build.yml

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python distribution to PyPI 🐍 
    needs: # Only runs if the build and docs jobs complete successfully
    - build
    - docs
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/veriflow
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI 🐍 
      uses: pypa/gh-action-pypi-publish@release/v1