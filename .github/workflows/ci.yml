name: CI
# Note that this workflow is referenced by name in other workflows,
#   any name change thus needs to be propagated.

on:
  push:
    branches:
    - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
# Run the linter (ruff and mypy)
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy 
  # Run pytest on a matrix of Python versions and operating systems
  pytest:
    # Needs the linter to succeed, before test matrix will run
    needs: lint
    name: Pytest with Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --dev --frozen
      - name: Install spatial dependencies
        if: matrix.python-version == '3.12' && (matrix.os == 'ubuntu-latest')
        run: uv sync --dev --group spatial --frozen
      - name: Run pytest
        run: |
          uv run pytest -m "not minio and not pyproj and not pysteps" --junit-xml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml --cov=veriflow --cov-report=term --cov-report=xml
      - name: Run pyproj/pysteps tests
        if: matrix.python-version == '3.12' && (matrix.os == 'ubuntu-latest')
        run: |
          uv run pytest -m "pyproj or pysteps" --junit-xml=test-results-deps-${{ matrix.os }}-${{ matrix.python-version }}.xml --cov=veriflow --cov-append --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        # Upload the test results, to be parsed by second workflow
        # Two workflows, in order to support PRs from forks, as per
        # explanation at https://github.com/dorny/test-reporter
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results*.xml

      - name: Upload coverage to Codecov
        # Upload once from a canonical matrix job and skip fork PRs (no secrets).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
