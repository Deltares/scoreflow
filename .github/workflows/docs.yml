name: Build and deploy docs

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published] # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-build.yml
    with:
      # Only produce the deployable Pages artifact for an actual release.
      upload-pages-artifact: ${{ github.event_name == 'release' }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'release' # Only publish docs when a release is published
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

